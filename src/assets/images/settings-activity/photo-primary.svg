<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520" fill="none">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="800" y2="520" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F7F7F5"/>
      <stop offset="1" stop-color="#ECEAE6"/>
    </linearGradient>
    <linearGradient id="floor" x1="400" y1="360" x2="400" y2="520" gradientUnits="userSpaceOnUse">
      <stop stop-color="#D8D2C8"/>
      <stop offset="1" stop-color="#C4BDB2"/>
    </linearGradient>
    <linearGradient id="desk" x1="120" y1="300" x2="420" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EDE8E0"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#C9A45C"/>
      <stop offset="1" stop-color="#9A7340"/>
    </linearGradient>
  </defs>

  <rect width="800" height="520" fill="url(#wall)"/>
  <rect y="390" width="800" height="130" fill="url(#floor)"/>

  <!-- marble veins -->
  <path d="M0 120 C180 90, 260 150, 400 110 S620 80, 800 130" stroke="#E2DDD6" stroke-width="2" opacity="0.7"/>
  <path d="M0 220 C200 190, 320 250, 520 210 S700 170, 800 230" stroke="#E8E3DC" stroke-width="1.5" opacity="0.6"/>

  <!-- wall logo area -->
  <g transform="translate(285 95)">
    <circle cx="115" cy="42" r="34" fill="none" stroke="url(#gold)" stroke-width="3"/>
    <path d="M115 18 C100 34, 88 52, 115 66 C142 52, 130 34, 115 18Z" fill="url(#gold)" opacity="0.85"/>
    <text x="115" y="118" text-anchor="middle" fill="url(#gold)" font-family="Cairo, Arial, sans-serif" font-size="22" font-weight="700">عيادات الليزر المتخصصة</text>
  </g>

  <!-- reception desk -->
  <path d="M90 360 H430 C445 360 455 372 455 388 V430 C455 446 445 458 430 458 H90 C75 458 65 446 65 430 V388 C65 372 75 360 90 360Z" fill="url(#desk)" stroke="#D9D2C8" stroke-width="2"/>
  <rect x="90" y="360" width="365" height="18" rx="4" fill="#FFFFFF" opacity="0.9"/>

  <!-- desk front panel -->
  <rect x="110" y="400" width="90" height="42" rx="4" fill="#F3EEE7" stroke="#DDD6CC"/>
  <rect x="220" y="400" width="90" height="42" rx="4" fill="#F3EEE7" stroke="#DDD6CC"/>

  <!-- chair -->
  <ellipse cx="520" cy="430" rx="48" ry="22" fill="#B8B0A4" opacity="0.55"/>
  <rect x="498" y="360" width="44" height="70" rx="10" fill="#C9C1B5"/>

  <!-- plant -->
  <rect x="640" y="330" width="26" height="70" rx="4" fill="#8D6E63"/>
  <circle cx="653" cy="310" r="34" fill="#66BB6A" opacity="0.75"/>
  <circle cx="635" cy="322" r="24" fill="#81C784" opacity="0.8"/>
  <circle cx="672" cy="318" r="20" fill="#4CAF50" opacity="0.7"/>

  <!-- ceiling light -->
  <rect x="360" y="24" width="80" height="10" rx="5" fill="#FFFFFF" opacity="0.85"/>
  <ellipse cx="400" cy="70" rx="120" ry="18" fill="#FFFFFF" opacity="0.18"/>
</svg>
