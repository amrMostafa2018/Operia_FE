<p-dialog
  [visible]="visible()"
  [modal]="true"
  [closable]="false"
  [appendTo]="'body'"
  [style]="{ width: width() }"
  [styleClass]="styleClass()"
  [closeOnEscape]="!confirming()"
>
  <ng-template pTemplate="header">
    <b>{{ headerKey() | translate }}</b>
    <button
      type="button"
      class="dialog-close"
      (click)="onCancel()"
      [disabled]="confirming()"
      [attr.aria-label]="'COMMON.CLOSE' | translate"
    >
      <i class="pi pi-times"></i>
    </button>
  </ng-template>

  <p class="confirm-dialog-copy">{{ messageKey() | translate: messageParams() }}</p>

  <ng-template pTemplate="footer">
    @if (useNativeFooterButtons()) {
      <div class="confirm-dialog-actions">
        <button type="button" class="cancel" [disabled]="confirming()" (click)="onCancel()">
          {{ cancelLabelKey() | translate }}
        </button>
        <button
          type="button"
          class="delete-confirm"
          [disabled]="confirming()"
          (click)="onConfirm()"
        >
          @if (confirming()) {
            <i class="pi pi-spin pi-spinner"></i>
          } @else if (confirmIcon()) {
            <i [class]="confirmIcon()"></i>
          }
          {{ confirmLabelKey() | translate }}
        </button>
      </div>
    } @else {
      <div class="confirm-dialog-actions">
        <p-button
          type="button"
          (onClick)="onCancel()"
          [disabled]="confirming()"
          [label]="cancelLabelKey() | translate"
        />
        <p-button
          type="button"
          (onClick)="onConfirm()"
          [loading]="confirming()"
          [disabled]="confirming()"
          [label]="confirmLabelKey() | translate"
        />
      </div>
    }
  </ng-template>
</p-dialog>
