<div class="otp-verification">
  <div class="form-title">
    <span class="title-icon"><i class="pi pi-shield"></i></span>
    <h2>{{ labels().title | translate }}</h2>
  </div>
  <p class="form-subtitle">{{ labels().subtitle | translate }}</p>

  <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
    <div class="field">
      <label [for]="inputId()">
        {{ labels().code | translate }} <span class="required">*</span>
      </label>
      <div class="input-wrapper otp-input-wrapper" [class.error]="isInvalid('code') || serverError()">
        <i class="pi pi-key input-icon"></i>
        <input
          [id]="inputId()"
          pInputText
          formControlName="code"
          [placeholder]="labels().placeholder | translate"
          inputmode="numeric"
          maxlength="6"
          autocomplete="one-time-code"
          class="p-inputtext-custom otp-input"
        />
      </div>
      @if (serverError()) {
        <small class="error-msg">{{ serverError() }}</small>
      } @else if (isInvalid('code')) {
        <small class="error-msg">{{ labels().invalid | translate }}</small>
      }
    </div>

    <div class="resend-row">
      @if (canResend()) {
        <button
          type="button"
          class="resend-btn"
          [disabled]="isResending()"
          (click)="onResend()"
        >
          @if (isResending()) {
            <i class="pi pi-spin pi-spinner"></i>
          }
          {{ labels().resend | translate }}
        </button>
      } @else {
        <span class="resend-countdown">
          {{ labels().resendIn | translate: { seconds: resendCountdown() } }}
        </span>
      }
    </div>

    <p-button
      type="submit"
      [label]="labels().verify | translate"
      [icon]="submitIcon()"
      iconPos="right"
      styleClass="submit-btn"
      [loading]="isLoading()"
      [disabled]="isLoading()"
    />

    <button type="button" class="back-btn" (click)="onBack()">
      <i class="pi pi-arrow-right"></i>
      {{ labels().back | translate }}
    </button>
  </form>
</div>
