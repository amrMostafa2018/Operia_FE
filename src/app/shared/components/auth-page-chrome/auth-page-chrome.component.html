@if (topLinkPrefixKey() && topLinkLabelKey() && topLinkRoute()) {
  <div class="page-top-link">
    <span>{{ topLinkPrefixKey()! | translate }}</span>
    <a [routerLink]="topLinkRoute()!" class="link-btn">{{ topLinkLabelKey()! | translate }}</a>
  </div>
}

<div class="auth-page-body">
  <div class="form-card" [style.max-width]="maxWidth()">
    @if (showHeader() && titleKey()) {
      <div class="form-title">
        @if (titleIcon()) {
          <span class="title-icon"><i [class]="titleIcon()"></i></span>
        }
        <h2>{{ titleKey()! | translate }}</h2>
      </div>
      @if (subtitleKey()) {
        <p class="form-subtitle">{{ subtitleKey()! | translate }}</p>
      }
    }

    <ng-content />
  </div>
</div>
