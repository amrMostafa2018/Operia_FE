<div class="settings-footer">
  <div class="footer-actions">
    <p-button
      [label]="'SETTINGS_ACTIVITY.FOOTER.SAVE' | translate"
      icon="pi pi-check"
      iconPos="right"
      styleClass="save-btn"
      (onClick)="save.emit()"
      [loading]="saving()"
    />
    @if (showReset()) {
      <p-button
        [label]="'SETTINGS_ACTIVITY.FOOTER.RESET' | translate"
        icon="pi pi-refresh"
        iconPos="right"
        [outlined]="true"
        styleClass="reset-btn"
        (onClick)="reset.emit()"
        [disabled]="saving()"
      />
    }
  </div>

  @if (noteKey()) {
    <div class="footer-note">
      <i class="pi pi-info-circle" aria-hidden="true"></i>
      <span>{{ noteKey()! | translate }}</span>
    </div>
  }
</div>
