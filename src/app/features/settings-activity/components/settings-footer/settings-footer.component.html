<div class="settings-footer">
  @if (noteKey()) {
    <p class="footer-note">
      <i class="pi pi-lock" aria-hidden="true"></i>
      {{ noteKey()! | translate }}
    </p>
  }

  <div class="footer-actions">
    @if (showReset()) {
      <p-button
        [label]="'SETTINGS_ACTIVITY.FOOTER.RESET' | translate"
        icon="pi pi-refresh"
        [outlined]="true"
        styleClass="reset-btn"
        (onClick)="reset.emit()"
        [disabled]="saving()"
      />
    }
    <p-button
      [label]="'SETTINGS_ACTIVITY.FOOTER.SAVE' | translate"
      icon="pi pi-check"
      iconPos="right"
      styleClass="save-btn"
      (onClick)="save.emit()"
      [loading]="saving()"
    />
  </div>
</div>
