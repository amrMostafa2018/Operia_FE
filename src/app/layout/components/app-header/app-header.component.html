<header class="app-header">

  <!-- Mobile menu only -->
  <div class="header-start">
    <button
      class="mobile-menu-btn"
      type="button"
      (click)="onToggleSidebar()"
      [attr.aria-label]="'HEADER.TOGGLE_SIDEBAR' | translate"
    >
      <i class="pi pi-bars"></i>
    </button>
  </div>

  <!-- End: language + notifications + user -->
  <div class="header-end">
    <div class="header-actions">
      <app-language-switcher />
    </div>

    <!-- Notification bell -->
    <button class="icon-btn notif-btn" [attr.aria-label]="'HEADER.NOTIFICATIONS' | translate">
      <i class="pi pi-bell"></i>
      <span class="notif-dot"></span>
    </button>

    <!-- User block -->
    <div class="user-block">
      <div class="user-avatar" [attr.aria-label]="userName()">
        {{ userInitials() }}
      </div>
      <div class="user-info">
        @if (businessName()) {
          <span class="business-name">{{ businessName() }}</span>
        }
        <span class="user-name">{{ userName() }}</span>
      </div>
    </div>

    <!-- Logout -->
    <button class="icon-btn logout-btn" (click)="logout()" [title]="'HEADER.LOGOUT' | translate">
      <i class="pi pi-sign-out"></i>
    </button>
  </div>

</header>
